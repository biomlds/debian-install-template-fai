name: build-fai-iso
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            btrfs-progs \
            ca-certificates \
            cryptsetup \
            curl \
            dosfstools \
            e2fsprogs \
            fai-client \
            fai-server \
            fai-setup-storage \
            git \
            make \
            mtools \
            grub-efi-amd64-bin \
            grub-pc-bin \
            isolinux \
            syslinux-common \
            python3 \
            python3-yaml \
            rsync \
            shellcheck \
            squashfs-tools \
            util-linux \
            xorriso
      - name: Validate public policy
        run: make validate manifest-check
      - name: Build pinned host tools in ephemeral runner
        run: ./tools/build-host-tools.sh --native
      - name: Build credential-free FAI ISO
        run: ./tools/build-iso.sh "$PWD/build/debian-fai-workstation.iso"
      - name: Verify output checksums and credential boundary
        run: |
          (cd build && sha256sum -c debian-fai-workstation.iso.sha256)
          sha256sum -c fai/config/assets/HOST_TOOLS.sha256
          python3 tools/scan-public.py fai/config
      - name: Preserve FAI build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fai-build-logs-${{ github.run_id }}
          path: /var/log/fai/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: debian-fai-workstation-${{ github.ref_name }}
          path: |
            build/debian-fai-workstation.iso
            build/debian-fai-workstation.iso.sha256
            fai/config/assets/HOST_TOOLS.sha256
            fai/config/assets/HOST_TOOLS.versions
          if-no-files-found: error
          retention-days: 14
