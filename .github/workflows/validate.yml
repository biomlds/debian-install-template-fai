name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    container:
      image: debian:trixie

    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            btrfs-progs \
            ca-certificates \
            cryptsetup \
            dosfstools \
            fai-setup-storage \
            git \
            make \
            python3 \
            python3-yaml \
            shellcheck

      - name: Validate repository
        run: make validate

      - name: Check manifest
        run: |
          make manifest-check
          sha256sum -c MANIFEST.sha256

      - name: Reject credential material
        run: |
          python3 tools/scan-public.py fai/config
