name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    container:
      image: debian:trixie

    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            btrfs-progs \
            ca-certificates \
            cryptsetup \
            dosfstools \
            fai-setup-storage \
            git \
            make \
            python3 \
            python3-yaml \
            shellcheck

      - name: Validate repository
        run: make validate

      - name: Build and check manifest
        run: |
          make manifest
          sha256sum -c MANIFEST.sha256
          git diff --exit-code -- MANIFEST.sha256

      - name: Reject credential material
        run: |
          if grep -RIlE \
            'BEGIN (OPENSSH|RSA|EC|DSA) PRIVATE KEY|\$\{\{[[:space:]]*secrets\.' \
            . \
            --exclude-dir=.git \
            --exclude-dir=.github \
            --exclude='*.md' \
            --exclude='validate.py'; then
            echo "Credential material found in repository." >&2
            exit 1
          fi
